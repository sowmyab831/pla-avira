# EXAMPLE: How to create secrets for external LLM credentials
# DO NOT commit this file with real credentials to Git!
# Instead, use sealed-secrets or Vault for production.
#
# Create secrets from environment variables:
# kubectl create secret generic google-creds \
#   --from-file=credentials.json=./secrets/credentials.json \
#   -n pla
#
# kubectl create secret generic external-llm-keys \
#   --from-literal=OPENAI_API_KEY=sk-... \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#   --from-literal=GEMINI_API_KEY=AIza... \
#   -n pla
#
# For sealed-secrets (recommended for GitOps):
# 1. Install sealed-secrets: https://github.com/bitnami-labs/sealed-secrets
# 2. Create a secret and seal it:
#    kubectl create secret generic external-llm-keys \
#      --from-literal=OPENAI_API_KEY=sk-... \
#      --dry-run=client -o yaml | \
#      kubeseal -f - > k8s/sealed-external-llm-keys.yaml
# 3. Commit sealed-external-llm-keys.yaml to Git
#
# For HashiCorp Vault (production):
# Use external-secrets operator to sync Vault secrets to K8s
# See: https://external-secrets.io/
---
apiVersion: v1
kind: Secret
metadata:
  name: external-llm-keys
  namespace: pla
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-changeme"
  ANTHROPIC_API_KEY: "sk-ant-changeme"
  GEMINI_API_KEY: "AIza-changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: google-creds
  namespace: pla
type: Opaque
stringData:
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n",
      "client_email": "your-service-account@your-project.iam.gserviceaccount.com",
      "client_id": "...",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "..."
    }
