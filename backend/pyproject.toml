[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pla-backend"
version = "0.1.0"
description = "Personal Life Assistant - FastAPI backend with privacy & search"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "huggingface-hub==0.16.4",
    "asyncpg==0.29.0",
    "redis==5.0.1",
    "httpx==0.25.2",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
    "presidio-analyzer==2.2.35",
    "presidio-anonymizer==2.2.35",
    "sentence-transformers==2.7.0",
    "torch>=2.0.0",  # GPU support via CUDA/Metal
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "transformers>=4.35.0",
    "numpy==1.24.3",
    "pandas==2.1.3",
    "pdfplumber==0.10.3",
    "requests==2.31.0",
    "qdrant-client==1.6.9",
    "meilisearch==0.27.0",
    "minio==7.2.0",
    "spacy==3.8.0",
    "anthropic==0.7.1",
    "openai==1.3.5",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.0.0",
    "aiohttp==3.9.1",
    "beautifulsoup4==4.12.2",
    "bcrypt==4.1.2",
    "PyJWT==2.8.0",
    "email-validator==2.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.3",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
]
